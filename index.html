<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#ee4d2d">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap&subset=vietnamese" rel="stylesheet">
<title>Căn tin</title>
<style>
:root{--bg:#fff7ed;--tx:#1f2937;--mu:#6b7280;--pri:#ea580c;--grn:#16a34a;--blu:#2563eb;--org:#d97706;--red:#dc2626;--bd:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px;background:var(--bg);color:var(--tx)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--pri);color:#fff}
header .ttl{flex:1;font-weight:700;font-size:19px}
header .back{background:none;border:0;color:#fff;font-size:36px;line-height:1;padding:0 8px;cursor:pointer}
header .who{font-size:13px;opacity:.95;text-align:right}
main{padding:12px;max-width:900px;margin:0 auto}
h3{margin:4px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:#fff;border:0;border-radius:16px;padding:18px 8px;font-size:17px;font-weight:600;box-shadow:0 2px 6px #0001;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--tx);cursor:pointer;font-family:inherit}
.tile .ic{font-size:42px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
.card.hl{outline:3px solid var(--pri)}
input,select,textarea{width:100%;font-size:18px;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin:4px 0 10px;background:#fff;color:var(--tx);font-family:inherit}
input.big{font-size:24px;font-weight:700}
label{font-size:15px;color:var(--mu)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-size:18px;font-weight:600;background:#e5e7eb;color:var(--tx);cursor:pointer;font-family:inherit}
.btn.primary{background:var(--pri);color:#fff}.btn.green{background:var(--grn);color:#fff}.btn.blue{background:var(--blu);color:#fff}
.btn.orange{background:var(--org);color:#fff}.btn.red{background:var(--red);color:#fff}.btn.sm{padding:6px 10px;font-size:14px}
.btn.full{width:100%}.btn.big{padding:16px;font-size:20px}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{border:2px solid var(--pri);background:#fff;color:var(--pri);border-radius:999px;padding:10px 16px;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit}
.chip.on{background:var(--pri);color:#fff}.chips.sm .chip{padding:6px 12px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
.pc{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px #0002;text-align:center;padding:0 0 8px;border:0;font:inherit;color:inherit;cursor:pointer}
.pc img,.pc .ph{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#fde68a}
.pc .ph{display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700;color:#b45309}
.pc .n{font-size:15px;font-weight:600;padding:4px 4px 0;line-height:1.2}
.pc .p{color:var(--pri);font-weight:700;font-size:16px}
.pc .t{font-size:12px;color:var(--mu)}
.neg{color:var(--red)!important}
.cart{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -4px 12px #0002;padding:10px 12px;border-radius:16px 16px 0 0;z-index:4}
.cart .lines{max-height:28vh;overflow:auto}
.line{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed var(--bd)}
.qty{width:42px;height:42px;border-radius:50%;border:0;background:#ffedd5;font-size:22px;font-weight:700;cursor:pointer}
.total{font-size:22px;text-align:right;margin:6px 0}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pay .btn{padding:14px 4px;font-size:16px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f3f4f6}
.kv.big b{font-size:24px;color:var(--pri)}
.kv input{width:150px;margin:0;padding:8px;text-align:right;font-weight:700}
.muted{color:var(--mu);font-size:15px}.center{text-align:center}.r{text-align:right}.w90{width:95px}
.ok{color:var(--grn);font-size:15px;margin:6px 0}.warn{color:var(--red);font-weight:600;font-size:15px}
.inv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;align-items:end;margin-bottom:6px}
.inv input{margin:0;text-align:center;font-size:20px;font-weight:700;padding:10px 4px}
.inv .b{background:#f3f4f6;border-radius:10px;padding:11px 4px;text-align:center;font-weight:700;font-size:20px}
.inv label{font-size:13px}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:right}
th:first-child,td:first-child{text-align:left}
table.mg td,table.mg th{font-size:17px}table.mg input{margin:0;padding:8px;text-align:center;font-size:20px;font-weight:700;width:90px}
.bar{height:12px;background:#f3f4f6;border-radius:6px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--grn)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.stat div{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 4px #0001}
.stat span{font-size:14px;color:var(--mu)}.stat b{display:block;font-size:20px}
.login{max-width:460px;margin:20px auto;padding:16px;text-align:center}.login .logo{font-size:64px}
#loading{position:fixed;inset:0;background:#fff8;display:flex;align-items:center;justify-content:center;z-index:50}
.spin{width:48px;height:48px;border:5px solid #fed7aa;border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:12px;z-index:60;font-size:17px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}#toast.err{background:var(--red)}
#modal{position:fixed;inset:0;background:#0006;z-index:40;display:flex;align-items:flex-end;justify-content:center}
#modal .box{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
#cam video{border-radius:12px}
.hero{width:100%;display:flex;align-items:center;gap:16px;border:0;border-radius:18px;padding:22px 20px;margin-bottom:14px;background:linear-gradient(135deg,#ea580c,#f59e0b);color:#fff;text-align:left;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px #ea580c55}
.hero .ic{font-size:56px;line-height:1}.hero b{display:block;font-size:26px}.hero small{font-size:16px;opacity:.95}
.sec{font-size:15px;font-weight:700;color:var(--mu);text-transform:uppercase;margin:16px 4px 8px}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:12px}
.qrc{background:#fff;border:1px dashed #9ca3af;border-radius:10px;padding:10px;text-align:center;break-inside:avoid}
.qrc>div:first-child{display:flex;justify-content:center;margin-bottom:6px}

/* ===== form & quản trị ===== */
.av{width:44px;height:44px;border-radius:50%;color:#fff;font-weight:700;font-size:19px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#f3f4f6;color:#4b5563;vertical-align:middle}
.tag.ql{background:#ede9fe;color:#6d28d9}.tag.nv{background:#dbeafe;color:#1d4ed8}.tag.me{background:#ffedd5;color:#c2410c}.tag.off{background:#e5e7eb;color:#6b7280}
.tag.ok{background:#dcfce7;color:#15803d}.tag.wn{background:#fef3c7;color:#b45309}.tag.er{background:#fee2e2;color:#b91c1c}
.nvc{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px #0001}
.nvc.off{opacity:.55}.nvc .nm{font-weight:700;font-size:18px;line-height:1.3}.nvc .sub{font-size:14px;color:var(--mu)}
.pinrow{font-size:14px;color:var(--mu);margin-top:2px}.pinrow b{letter-spacing:2px;color:var(--tx)}
.eye{border:0;background:#f3f4f6;border-radius:8px;padding:2px 8px;font-size:14px;cursor:pointer;margin-left:6px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.mini div{background:#fff;border-radius:12px;padding:10px 6px;text-align:center;box-shadow:0 1px 4px #0001}
.mini b{display:block;font-size:24px;color:var(--pri)}.mini span{font-size:13px;color:var(--mu)}
.fhead{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.fsec{font-size:13px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 2px;padding-top:10px;border-top:1px solid #f3f4f6}
.seg{display:flex;background:#f3f4f6;border-radius:12px;padding:4px;margin:4px 0 10px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:10px;font-size:17px;font-weight:600;color:var(--mu);cursor:pointer;font-family:inherit}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px #0002}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 4px;color:var(--tx);font-size:17px;cursor:pointer}
.swrow small{color:var(--mu);font-size:13px}.swrow input{display:none}
.sw{width:52px;height:30px;border-radius:15px;background:#d1d5db;position:relative;transition:.2s;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px #0003}
.swrow input:checked+.sw{background:var(--grn)}.swrow input:checked+.sw::after{left:25px}
.swrow input:disabled+.sw{opacity:.5}
.ferr{background:#fee2e2;color:#b91c1c;border-radius:10px;padding:10px 12px;font-size:15px;font-weight:600;margin:10px 0}
.hint{font-size:13px;color:var(--mu);margin:-6px 0 8px}
.cnico{width:46px;height:46px;border-radius:14px;background:#ffedd5;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.cnh.off{opacity:.6}.chipstats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--mu);margin-top:10px}
.bdel{background:#fff;color:var(--red);border:2px solid #fecaca}
.rank{font-weight:800;color:var(--pri);width:22px;display:inline-block}
.sub2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;font-size:13px;color:var(--mu)}.sub2 b{display:block;font-size:16px;color:var(--tx)}

/* ===== Giao diện kiểu app đặt đồ ăn: cam đỏ, nền xám nhạt, thẻ trắng ===== */
:root{--bg:#f5f5f5;--tx:#222;--mu:#757575;--pri:#ee4d2d;--grn:#26aa99;--blu:#2f80ed;--org:#ff9800;--red:#d0011b;--bd:#ececec}
body{font-family:Roboto,"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;font-size:17px;letter-spacing:.1px}
header{background:linear-gradient(90deg,#ee4d2d,#ff7337);box-shadow:0 2px 6px #ee4d2d44}
header .ttl{font-weight:700}
.tile{border-radius:12px;box-shadow:0 1px 3px #0000001a;font-weight:500;font-size:15px;padding:16px 6px}
.tile .ic{width:60px;height:60px;border-radius:50%;background:#fff1ed;display:flex;align-items:center;justify-content:center;font-size:30px}
.card,.nvc,.stat div,.mini div{border-radius:10px;box-shadow:0 1px 3px #0000001a}
.btn{border-radius:8px;font-weight:500}
.btn.primary{background:linear-gradient(90deg,#ee4d2d,#ff6633);box-shadow:0 2px 4px #ee4d2d55}
.btn.green{background:var(--grn)}
.chip{border-width:1px;font-weight:500}
.chip.on{box-shadow:0 1px 3px #ee4d2d55}
input,select,textarea{border-radius:8px;border-color:#e0e0e0}
input:focus,select:focus,textarea:focus{outline:2px solid #ee4d2d55;border-color:var(--pri)}
.hero{border-radius:14px;background:linear-gradient(120deg,#ee4d2d,#ff8a50);box-shadow:0 4px 12px #ee4d2d55}
.hero .ic{width:68px;height:68px;border-radius:50%;background:#ffffff33;display:flex;align-items:center;justify-content:center;font-size:36px}
.sec{color:#222;font-size:16px;text-transform:none;font-weight:700;border-left:4px solid var(--pri);padding-left:8px}
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pc{position:relative;border-radius:10px;text-align:left;padding:0 0 10px;box-shadow:0 1px 3px #0000001a}
.pc img,.pc .ph{aspect-ratio:4/3;background:#ffe9d8}
.pc .n{font-weight:500;font-size:15px;padding:8px 10px 0;min-height:42px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .p{padding:2px 10px 0;font-size:18px;font-weight:700;color:var(--pri)}
.pc .t{padding:0 10px}
.pc .plus{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:50%;background:var(--pri);color:#fff;font-size:24px;line-height:30px;text-align:center;font-weight:500;box-shadow:0 2px 4px #ee4d2d66}
.pc:active .plus{transform:scale(.9)}
.cart{border-radius:16px 16px 0 0;box-shadow:0 -2px 12px #0003}
.cart .total b{color:var(--pri);font-size:24px}
.qty{background:#fff1ed;color:var(--pri)}
.tag.me{background:#fff1ed;color:var(--pri)}
.mini b,.kv.big b{color:var(--pri)}
#toast{border-radius:8px}
@media print{header,.btn,.noprint{display:none!important}body{background:#fff}.qrgrid{grid-template-columns:repeat(4,1fr)}}
table.xnt{font-size:12px;white-space:nowrap}table.xnt th,table.xnt td{padding:4px 6px;text-align:right}table.xnt td:first-child,table.xnt th:first-child{text-align:left}@media print{.btn,.chips,input,select,label,header,nav{display:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="loading" class="hide"><div class="spin"></div></div>
<div id="toast"></div>
<div id="modal" class="hide"><div class="box" id="modalBox"></div></div>

<script>
let U = null, ME = null;
const gid = id => document.getElementById(id);
const money = n => Math.round(+n || 0).toLocaleString('vi-VN') + 'đ';
const esc = s => String(s == null ? '' : s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split(String.fromCharCode(34)).join('&quot;').split(String.fromCharCode(39)).join('&#39;');
const isQL = () => ME && ME.vaiTro === 'Quản lý';
const tenCN = () => (ME && (ME.tenTruong || ME.truong)) || '';
const kv = (k, v, cls) => `<div class="kv ${cls || ''}"><span>${k}</span><b>${v}</b></div>`;
const DAU = new RegExp('[' + String.fromCharCode(0x300) + '-' + String.fromCharCode(0x36F) + ']', 'g');
const noDau = s => String(s || '').normalize('NFD').replace(DAU, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
const fmtDate = d => d ? d.split('-').reverse().join('/') : '';
const numIn = (id, v, ph, extra) => `<input type="number" inputmode="numeric" id="${id}" value="${v == null ? '' : v}" placeholder="${ph || ''}" ${extra || ''}>`;
const val = id => gid(id).value;
const nv = id => +gid(id).value || 0;
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function curDot() { const hm = new Date().toTimeString().slice(0, 5); let id = 1; ME.dots.forEach(d => { if (hm >= d.tu) id = d.id; }); return id; }
const spOf = ma => ME.sp.find(p => p.ma === ma);

/* ===== CẤU HÌNH: dán URL Web app của Apps Script (kết thúc bằng /exec) ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyRV-y0Ul1neVwBrzcvsR3ll5bhT5TSpnsefC5HSXVmJlSxeFkuY44vy1D98QnMnwsv6Q/exec';
async function api(fn, ...args) {
  gid('loading').classList.remove('hide');
  try {
    // Không đặt header riêng để tránh CORS preflight
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn, args: [U, ...args] }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    return j.data;
  } catch (e) {
    toast((e && e.message) || String(e), true);
    throw e;
  } finally {
    gid('loading').classList.add('hide');
  }
}
let toastT;
function toast(msg, err) {
  const t = gid('toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', err ? Math.max(4000, String(msg).length * 70) : 2200);
}
function modal(html) { gid('modalBox').innerHTML = html; gid('modal').classList.remove('hide'); }
function closeModal() { gid('modal').classList.add('hide'); gid('modalBox').innerHTML = ''; }
gid('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
function askText(title, ph, list) {
  return new Promise(res => {
    modal(`<h3>${title}</h3><input id="askIn" list="askDl" placeholder="${esc(ph)}"><datalist id="askDl">${(list || []).map(x => `<option value="${esc(x)}">`).join('')}</datalist>
      <div class="row"><button class="btn grow" id="askNo">Hủy</button><button class="btn primary grow" id="askOk">OK</button></div>`);
    gid('askIn').focus();
    gid('askNo').onclick = () => { closeModal(); res(''); };
    gid('askOk').onclick = () => { const v = val('askIn').trim(); closeModal(); res(v); };
  });
}
function layout(title, body) {
  stopCam();
  gid('app').innerHTML = `<header><button class="back" onclick="go('home')">‹</button><div class="ttl">${title}</div>
    <div class="who">${esc(ME.ten)}<br>${esc(tenCN())} • ${esc(ME.quay)}</div></header><main id="main">${body}</main>`;
  window.scrollTo(0, 0);
}
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k) || ''; localStorage.setItem(k, v); } catch (e) { return ''; } }

async function showLogin() {
  gid('app').innerHTML = '<div class="login"><div class="logo">&#x1F371;</div><h1 style="margin:0">Căn tin</h1><div id="lg">Đang tải…</div></div>';
  let L;
  try { L = await api('getDanhSachNV'); }
  catch (e) { gid('lg').innerHTML = '<p class="warn">Không kết nối được máy chủ.<br>Kiểm tra mạng và API_URL.</p><button class="btn primary" onclick="showLogin()">Thử lại</button>'; return; }
  const s = { ten: store('ct_ten'), truong: store('ct_truong'), quay: store('ct_quay') };
  if (!L.truongs.some(t => t.ma === s.truong)) s.truong = '';
  const chips = (arr, key) => arr.map(x => `<button class="chip ${x === s[key] ? 'on' : ''}" data-k="${key}" data-v="${esc(x)}">${esc(x)}</button>`).join('');
  const chipsT = arr => arr.map(x => `<button class="chip ${x.ma === s.truong ? 'on' : ''}" data-k="truong" data-v="${esc(x.ma)}">${esc(x.ten)}</button>`).join('');
  const draw = () => {
    const me = L.nv.find(x => x.ten === s.ten);
    const canChonTruong = me && !me.truong;
    gid('lg').innerHTML = `<label>Bạn là ai?</label><div class="chips" style="justify-content:center">${chips(L.nv.map(x => x.ten), 'ten')}</div>
      ${canChonTruong ? `<label>Chi nhánh</label><div class="chips" style="justify-content:center">${chipsT(L.truongs)}</div>` : ''}
      <label>Quầy</label><div class="chips" style="justify-content:center">${chips(L.quays, 'quay')}</div>
      <label>Mã PIN</label><input id="pin" type="password" inputmode="numeric" class="big center" autocomplete="off">
      <button class="btn primary full big" id="btnLogin">Vào làm việc</button>`;
    document.querySelectorAll('#lg .chip').forEach(b => b.onclick = () => {
      s[b.dataset.k] = b.dataset.v;
      if (b.dataset.k === 'ten') { const m = L.nv.find(x => x.ten === s.ten); if (m && m.quay && !s.quay) s.quay = m.quay; }
      const pin = val('pin'); draw(); gid('pin').value = pin;
    });
    const vao = async () => {
      if (!s.ten) return toast('Chọn tên của bạn', true);
      if (!s.quay) return toast('Chọn quầy', true);
      const m = L.nv.find(x => x.ten === s.ten);
      if (m && !m.truong && !s.truong) return toast('Chọn chi nhánh', true);
      U = { ten: s.ten, pin: val('pin'), truong: m && m.truong ? m.truong : s.truong, quay: s.quay };
      try { ME = await api('dangNhap'); } catch (e) { U = null; return; }
      store('ct_ten', s.ten); store('ct_quay', s.quay); if (s.truong) store('ct_truong', s.truong);
      go('home');
    };
    gid('btnLogin').onclick = vao;

const QR_LIB = 'https:' + '/' + '/cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
const tlv = (id, v) => id + String(v.length).padStart(2, '0') + v;
function crc16(s) {
  let c = 0xFFFF;
  for (let i = 0; i < s.length; i++) {
    c ^= s.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF;
  }
  return c.toString(16).toUpperCase().padStart(4, '0');
}
function vietQR(tk, soTien, noiDung) {
  const acc = tlv('00', 'A000000727') + tlv('01', tlv('00', tk.bin) + tlv('01', tk.stk)) + tlv('02', 'QRIBFTTA');
  const s = tlv('00', '01') + tlv('01', soTien ? '12' : '11') + tlv('38', acc) + tlv('53', '704') +
    (soTien ? tlv('54', String(Math.round(soTien))) : '') + tlv('58', 'VN') + (noiDung ? tlv('62', tlv('08', noiDung)) : '') + '6304';
  return s + crc16(s);
}
const ndCK = them => ('CANTIN ' + noDau(ME.truong) + (them ? ' ' + them : '')).toUpperCase().replace(/[^A-Z0-9 ]/g, '').slice(0, 25);
function moQRChuyenKhoan(tong) {

      <div class="row"><button class="btn grow" id="vqNo">Hủy</button><button class="btn green grow big" id="vqOk">✔ Đã nhận tiền</button></div>`);
    new QRCode(gid('vq'), { text: vietQR(tk, tong, nd), width: 250, height: 250, correctLevel: QRCode.CorrectLevel.M });
    gid('vqNo').onclick = () => { closeModal(); res(false); };
    gid('vqOk').onclick = () => { closeModal(); res(true); };
  })).catch(() => { toast('Không tải được trình tạo mã QR', true); return false; });
}

/* ===== QUÉT QR: camera trực tiếp (trang chạy trên HTTPS nên được cấp quyền camera) ===== */
let QR = null, lastCode = '', lastT = 0;
store('ct_chup', '0'); // xóa cờ "chụp ảnh" cũ bị lưu kẹt
let CHE_DO_CHUP = false; // luôn thử quét trực tiếp trước
const H5_LIB = 'https:' + '/' + '/unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
function loadScript(src, ten) {
  return new Promise((res, rej) => { if (window[ten]) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
function quetMa(onCode, boxId) {
  if (CHE_DO_CHUP) return chupMa(onCode);
  camScan(onCode, boxId);
}
/* Dự phòng khi trình duyệt chặn camera: chụp ảnh rồi đọc mã */
function chupMa(onCode) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/' + String.fromCharCode(42); inp.setAttribute('capture', 'environment');
  inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = () => { const f = inp.files[0]; inp.remove(); if (f) docAnhQR(f, onCode); };
  inp.click();
}
function thuNho(file, max) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => res(new File([b], 'qr.jpg', { type: 'image/jpeg' })), 'image/jpeg', 0.9);
    };
    img.onerror = rej; img.src = url;
  });
}
async function docAnhQR(file, onCode) {
  try { await loadScript(H5_LIB, 'Html5Qrcode'); } catch (e) { return toast('Không tải được trình đọc mã', true); }
  gid('loading').classList.remove('hide');
  const el = document.createElement('div'); el.id = 'qrTmp' + Date.now(); el.style.display = 'none'; document.body.appendChild(el);
  try {
    const anh = await thuNho(file, 1200).catch(() => file);
    onCode(await new Html5Qrcode(el.id).scanFile(anh, false));
  } catch (e) {
    toast('Không đọc được mã. Chụp gần hơn, đủ sáng, mã nằm giữa ảnh.', true);
  } finally { gid('loading').classList.add('hide'); el.remove(); }
}
function chuyenSangChup() {
  CHE_DO_CHUP = true; store('ct_chup', '1');
  const b = gid('btnCam'); if (b) b.innerHTML = '&#x1F4F7; CHỤP ẢNH MÃ QR';
  toast('Không mở được camera. Hãy cho phép camera cho trang này trong cài đặt trình duyệt, hoặc dùng nút CHỤP ẢNH.', true);
}
function batCamTrucTiep() { CHE_DO_CHUP = false; store('ct_chup', '0'); go('ban'); }
async function camScan(onCode, boxId) {
  boxId = boxId || 'cam';
  if (QR) return stopCam();
  try { await loadScript(H5_LIB, 'Html5QrcodeScanner'); } catch (e) { return toast('Không tải được trình quét', true); }
  if (!gid(boxId)) return;
  // Dùng Html5QrcodeScanner (có sẵn nút "Request Camera Permissions") giống mẫu đã chạy được trên Apps Script
  gid(boxId).innerHTML = '<div id="camView"></div><button class="btn full" style="margin:6px 0" onclick="stopCam()">⏹ Đóng khung quét</button>';
  const b = gid('btnCam'); if (b) b.classList.add('hide');
  QR = new Html5QrcodeScanner('camView', {
    fps: 15,
    // quét toàn khung hình (không cắt nhỏ) để bắt được mã QR/mã vạch cỡ nhỏ
    qrbox: (w, h) => ({ width: Math.floor(w * 0.95), height: Math.floor(h * 0.95) }),
    rememberLastUsedCamera: true,
    // độ phân giải cao hơn: mã nhỏ có nhiều điểm ảnh hơn, dễ đọc hơn
    videoConstraints: { width: { ideal: 1920 }, height: { ideal: 1080 } },
    showZoomSliderIfSupported: true, defaultZoomValueIfSupported: 2, showTorchButtonIfSupported: true,
    formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E, Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39, Html5QrcodeSupportedFormats.ITF],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
  }, false);
  QR.render(txt => {
    if (txt === lastCode && Date.now() - lastT < 1500) return;
    lastCode = txt; lastT = Date.now(); onCode(txt);
  }, () => {});
}
// Báo rõ lý do không mở được camera, không tự chuyển chế độ
function camLoi(err, onCode, boxId) {
  const m = String((err && err.message) || err);
  let goiY = 'Kiểm tra quyền camera của trình duyệt.';
  if (/NotAllowed|Permission|denied/i.test(m)) goiY = 'Camera đang bị chặn. Bấm biểu tượng ổ khóa cạnh thanh địa chỉ → Camera → Cho phép, rồi tải lại trang.';
  else if (/NotFound|Requested device/i.test(m)) goiY = 'Không tìm thấy camera trên máy.';
  else if (/NotReadable|in use|Could not start/i.test(m)) goiY = 'Camera đang bị app khác dùng. Tắt app đó rồi thử lại.';
  else if (/secure|https/i.test(m)) goiY = 'Phải mở bằng link https của Apps Script, bằng Chrome hoặc Safari.';
  const box = gid(boxId); if (!box) return;
  box.innerHTML = `<div class="card"><div class="warn">Không mở được camera</div><div class="muted">${esc(goiY)}<br>Chi tiết: ${esc(m)}</div>
    <div class="row" style="margin-top:8px"><button class="btn primary grow" id="camRetry">Thử lại</button><button class="btn orange grow" id="camChup">Chụp ảnh</button></div></div>`;
  gid('camRetry').onclick = () => camScan(onCode, boxId);
  gid('camChup').onclick = () => chupMa(onCode);
}
function stopCam() {
  if (QR) { const q = QR; QR = null; try { const p = q.clear(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
  ['cam', 'camSP'].forEach(id => { const el = gid(id); if (el) el.innerHTML = ''; });
  const b = gid('btnCam'); if (b) b.classList.remove('hide');
}

let NH = [];

      <div class="grow"><label>Đơn vị</label><input id="fDvt" value="${esc(p.dvt)}" placeholder="cây, ly, kg…"></div></div>
    <div class="row"><div class="grow"><label>Giá vốn</label>${numIn('fVon', p.giaVon)}</div><div class="grow"><label>Giá bán</label>${numIn('fBan', p.giaBan)}</div></div>
    ${ma ? kv('Tồn hiện tại', p.ton) : `<label>Tồn ban đầu</label>${numIn('fTon', '')}`}
    <label>Mã vạch</label><div class="row"><input id="fMv" class="grow" value="${esc(p.maVach)}" placeholder="Quét hoặc gõ"><button class="btn" style="margin-bottom:6px" onclick="quetMa(t=>{gid('fMv').value=t;stopCam()},'camSP')">&#x1F4F7;</button></div>

    <div class="row" style="margin-top:10px"><button class="btn grow" onclick="stopCam();closeModal()">Hủy</button><button class="btn primary grow" onclick="luuSP('${ma || ''}')">&#x1F4BE; Lưu</button></div>`);
  gid('spAnh').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    ANH = await resizeImg(f);
    gid('anhXem').innerHTML = `<img src="${ANH}" style="width:90px;height:90px;object-fit:cover;border-radius:10px">`;
  };
}
function resizeImg(file, max) {
  max = max || 300;
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.7)); }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

function renderNVList() {
  const k = noDau(NV_Q);
  const lst = NVD.ds.map((x, i) => ({ x, i })).filter(({ x }) => (!NV_CN || (NV_CN === '*' ? !x.truong : x.truong === NV_CN)) && (!k || noDau(x.ten).includes(k)));
  if (!lst.length) { gid('nvList').innerHTML = '<p class="muted center">Không có tài khoản nào</p>'; return; }
  const card = ({ x, i }) => `<div class="nvc ${x.hoatDong ? '' : 'off'}">${avatar(x.ten)}
    <div class="grow"><div class="nm">${esc(x.ten)} <span class="tag ${x.vaiTro === 'Quản lý' ? 'ql' : 'nv'}">${x.vaiTro === 'Quản lý' ? (x.truong ? 'Quản lý CN' : 'Quản lý tổng') : 'Nhân viên'}</span>
        ${x.laToi ? '<span class="tag me">Bạn</span>' : ''}${x.hoatDong ? '' : '<span class="tag off">Đã khóa</span>'}</div>
      <div class="sub">${x.truong ? esc(cnTenOf(x.truong)) : 'Tất cả chi nhánh'}${x.quay ? ' • Quầy ' + esc(x.quay) : ''}</div>
      ${x.sua ? `<div class="pinrow">PIN: <b id="pin${i}">••••</b><button class="eye" onclick="revealPin(${i})">&#x1F441;</button></div>` : ''}</div>

function nvSet(k, v) {
  syncNV(); NVF[k] = v;
  if (k === 'vaiTro' && v === 'Nhân viên' && !NVF.truong) NVF.truong = ME.truong || '';
  drawNV();
}
function nvRandPin() { syncNV(); NVF.pin = String(Math.floor(1000 + Math.random() * 9000)); drawNV(); }
function drawNV() {
  const f = NVF, edit = !!f.goc, tq = NVD.toanQuyen, isQL = f.vaiTro === 'Quản lý';
  const cns = NVD.chiNhanh.filter(c => c.hoatDong || c.ma === f.truong);
  modal(`<div class="fhead">${avatar(f.ten || '?', 56)}<div><h3 style="margin:0">${edit ? 'Sửa tài khoản' : 'Thêm nhân viên'}</h3>
      <div class="muted">${edit ? 'Mã PIN để trống = giữ nguyên' : 'Tạo tên và mã PIN để đăng nhập'}</div></div></div>
    <div class="fsec" style="border:0;margin-top:4px">Thông tin</div>
    <label>Họ và tên</label><input id="nvTen" value="${esc(f.ten)}" placeholder="VD: Nguyễn Thị Trúc" maxlength="40" ${f.laToi ? 'readonly' : ''}>
    ${tq ? `<label>Vai trò</label><div class="seg"><button class="${!isQL ? 'on' : ''}" onclick="nvSet('vaiTro','Nhân viên')">&#x1F9D1;&#x200D;&#x1F373; Nhân viên</button><button class="${isQL ? 'on' : ''}" onclick="nvSet('vaiTro','Quản lý')">&#x1F454; Quản lý</button></div>` : ''}
    <label>Chi nhánh</label>
    <div class="chips sm">${tq ? (isQL ? `<button class="chip ${!f.truong ? 'on' : ''}" onclick="nvSet('truong','')">Tất cả chi nhánh</button>` : '') +
      cns.map(c => `<button class="chip ${f.truong === c.ma ? 'on' : ''}" data-v="${esc(c.ma)}" onclick="nvSet('truong',this.dataset.v)">${esc(c.ten)}</button>`).join('')
      : `<span class="chip on">${esc(cnTenOf(f.truong))}</span>`}</div>
    ${isQL ? `<div class="hint">${f.truong ? 'Quản lý chi nhánh: chỉ thấy số liệu chi nhánh này.' : 'Quản lý tổng: xem và quản trị tất cả chi nhánh.'}</div>` : ''}
    <label>Quầy mặc định</label>
    <div class="chips sm">${[''].concat(NVD.quays).map(q => `<button class="chip ${f.quay === q ? 'on' : ''}" data-v="${esc(q)}" onclick="nvSet('quay',this.dataset.v)">${q ? esc(q) : 'Không đặt'}</button>`).join('')}</div>
    <div class="fsec">Đăng nhập</div>
    <label>Mã PIN (4–8 chữ số)</label>
    <div class="row"><input id="nvPin" class="grow big" type="text" inputmode="numeric" maxlength="8" autocomplete="off" value="${esc(f.pin)}" placeholder="${edit ? 'Giữ nguyên' : 'VD: 1234'}" oninput="this.value=this.value.replace(/\\D/g,'')">
      <button class="btn" style="margin-bottom:10px;padding:14px 12px" onclick="nvRandPin()">&#x1F3B2; Tạo</button></div>
    ${switchRow('nvHd', 'Đang làm việc', 'Tắt = khóa, không đăng nhập được (vẫn giữ lịch sử)', f.hoatDong, f.laToi)}
    ${edit ? '<div class="hint" style="margin-top:6px">Đổi tên không làm đổi tên trong lịch sử cũ (điểm danh, đơn bán).</div>' : ''}
    <div class="row" style="margin-top:14px"><button class="btn grow" onclick="closeModal()">Hủy</button><button class="btn primary grow big" onclick="luuNV()">&#x1F4BE; Lưu</button></div>
    ${edit && !f.laToi ? '<button class="btn bdel full" style="margin-top:10px" onclick="xoaNV()">&#x1F5D1; Xóa tài khoản này</button>' : ''}`);
}
async function luuNV() {
  syncNV(); const f = NVF;
  if (!f.ten.trim()) return toast('Chưa nhập họ tên', true);
  if (!f.goc && !f.pin) return toast('Chưa nhập mã PIN', true);
  if (f.pin && !/^\d{4,8}$/.test(f.pin)) return toast('Mã PIN gồm 4–8 chữ số', true);
  if (f.vaiTro !== 'Quản lý' && !f.truong) return toast('Chọn chi nhánh', true);
  try { NVD = await api('luuNhanVien', { goc: f.goc, ten: f.ten.trim(), pin: f.pin, vaiTro: f.vaiTro, truong: f.truong, quay: f.quay, hoatDong: f.hoatDong }); }
  catch (e) { return; }
  if (f.laToi && f.pin) U.pin = f.pin;
  closeModal(); renderNV(); toast('✔ Đã lưu tài khoản');
}
async function xoaNV() {
  const f = NVF;
  if (!(await xacNhan('Xóa tài khoản?', `Xóa vĩnh viễn <b>${esc(f.goc)}</b>? Nếu chỉ tạm nghỉ, hãy tắt "Đang làm việc" thay vì xóa.`))) return drawNV();
  try { NVD = await api('xoaNhanVien', f.goc); } catch (e) { return drawNV(); }
  renderNV(); toast('Đã xóa tài khoản');
}

/* ---------- Chi nhánh ---------- */
const BANKS = ['Vietcombank', 'VietinBank', 'BIDV', 'Agribank', 'Techcombank', 'MB', 'ACB', 'VPBank', 'Sacombank', 'TPBank', 'VIB', 'SHB', 'HDBank', 'OCB', 'MSB', 'SeABank', 'Eximbank', 'LPBank', 'NamABank', 'BacABank'];
let CND = null, CNF = null;
async function scrChiNhanh() {
  layout('&#x1F3EC; Chi nhánh', '<div id="cnhBody"></div>');
  CND = await api('getChiNhanh'); renderCNH();
}
function renderCNH() {
  gid('cnhBody').innerHTML = `<button class="btn primary full big" onclick="formCNH(-1)">+ Thêm chi nhánh</button><div style="height:12px"></div>` +
    (CND.ds.map((c, i) => `<div class="card cnh ${c.hoatDong ? '' : 'off'}"><div class="row"><span class="cnico">&#x1F3EC;</span>
      <div class="grow"><b style="font-size:19px">${esc(c.ten)}</b> <span class="tag">${esc(c.ma)}</span>
        ${c.dangDung ? '<span class="tag me">Đang dùng</span>' : ''}${c.hoatDong ? '' : '<span class="tag off">Ngừng</span>'}
        <div class="muted">${esc(c.diaChi) || 'Chưa có địa chỉ'}${c.sdt ? ' • ' + esc(c.sdt) : ''}</div></div>
      <button class="btn sm" onclick="formCNH(${i})">Sửa</button></div>
      <div class="chipstats"><span>&#x1F465; ${c.soNV} nhân viên</span><span>&#x1F371; ${c.soSP} món</span>
        <span>${c.stk ? '&#x1F3E6; ' + esc(c.nganHang) + ' •••' + esc(c.stk.slice(-4)) : '&#x26A0;&#xFE0F; Chưa có tài khoản nhận tiền'}</span></div></div>`).join('') || '<p class="muted center">Chưa có chi nhánh</p>');
}
function formCNH(i) {
  const c = i >= 0 ? CND.ds[i] : { ma: '', ten: '', diaChi: '', sdt: '', nganHang: '', stk: '', tenTK: '', hoatDong: true, dangDung: false };
  CNF = { goc: i >= 0 ? c.ma : '', dangDung: c.dangDung };
  modal(`<div class="fhead"><span class="cnico">&#x1F3EC;</span><div><h3 style="margin:0">${i >= 0 ? 'Sửa chi nhánh' : 'Thêm chi nhánh'}</h3>
      <div class="muted">${i >= 0 ? esc(c.ma) : 'Mỗi chi nhánh có nhân viên, món và số liệu riêng'}</div></div></div>
    <div class="fsec" style="border:0;margin-top:4px">Thông tin</div>
    <label>Mã chi nhánh ${i >= 0 ? '(không đổi được)' : '(2–12 ký tự, không dấu)'}</label>
    <input id="cMa" value="${esc(c.ma)}" placeholder="VD: CS2" maxlength="12" ${i >= 0 ? 'readonly' : ''} oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9_-]/g,'')">
    <label>Tên chi nhánh</label><input id="cTen" value="${esc(c.ten)}" placeholder="VD: Huỳnh Tấn Phát - CS2">
    <label>Địa chỉ</label><input id="cDc" value="${esc(c.diaChi)}" placeholder="Số nhà, đường, quận…">
    <label>Điện thoại</label><input id="cSdt" type="tel" inputmode="tel" value="${esc(c.sdt)}" placeholder="09xx xxx xxx">
    <div class="fsec">Tài khoản nhận chuyển khoản</div>
    <div class="hint">Dùng để tạo mã QR khi khách chuyển khoản. Để trống nếu chi nhánh chưa dùng.</div>
    <label>Ngân hàng</label><input id="cNh" list="dlBank" value="${esc(c.nganHang)}" placeholder="Chọn hoặc gõ tên ngân hàng"><datalist id="dlBank">${BANKS.map(b => `<option value="${b}">`).join('')}</datalist>
    <label>Số tài khoản</label><input id="cStk" type="text" inputmode="numeric" value="${esc(c.stk)}" placeholder="Chỉ gồm chữ số" oninput="this.value=this.value.replace(/\\D/g,'')">
    <label>Tên chủ tài khoản</label><input id="cTk" value="${esc(c.tenTK)}" placeholder="VD: CONG TY ABC">
    ${switchRow('cHd', 'Đang hoạt động', 'Tắt = nhân viên chi nhánh này không đăng nhập được (vẫn giữ số liệu)', c.hoatDong, c.dangDung)}
    <div class="row" style="margin-top:14px"><button class="btn grow" onclick="closeModal()">Hủy</button><button class="btn primary grow big" onclick="luuCNH()">&#x1F4BE; Lưu</button></div>
    ${i >= 0 && !c.dangDung ? '<button class="btn bdel full" style="margin-top:10px" onclick="xoaCNH()">&#x1F5D1; Xóa chi nhánh này</button>' : ''}`);
}
async function luuCNH() {
  const d = { goc: CNF.goc, ma: val('cMa'), ten: val('cTen'), diaChi: val('cDc'), sdt: val('cSdt'), nganHang: val('cNh'), stk: val('cStk'), tenTK: val('cTk'), hoatDong: gid('cHd').checked };
  if (!d.goc && d.ma.length < 2) return toast('Nhập mã chi nhánh (2–12 ký tự)', true);
  if (!d.ten.trim()) return toast('Nhập tên chi nhánh', true);
  try { CND = await api('luuChiNhanh', d); } catch (e) { return; }
  if (d.goc && d.goc === ME.truong) { const nm = await api('dangNhap'); ME = nm; }
  closeModal(); renderCNH(); toast('✔ Đã lưu chi nhánh');
}
async function xoaCNH() {
  const ma = CNF.goc, c = CND.ds.find(x => x.ma === ma);
  if (!(await xacNhan('Xóa chi nhánh?', `Xóa <b>${esc(c.ten)}</b>? Chỉ xóa được khi chưa có dữ liệu bán hàng, nhân viên hoặc món nào. Nếu đã có, hãy chọn "Ngừng hoạt động".`))) return;
  try { CND = await api('xoaChiNhanh', ma); } catch (e) { return; }
  renderCNH(); toast('Đã xóa chi nhánh');
}

/* ---------- Tổng hợp tất cả cơ sở ---------- */
let TH_LOAI = 'Tháng';
function scrTongHop() {
  layout('&#x1F3C6; Tổng hợp các cơ sở', `<div class="chips" id="thChips"></div><input type="date" id="thNgay" value="${todayStr()}"><div id="thBody"></div>`);
  gid('thNgay').onchange = xemTH; thChips(); xemTH();
}
function thChips() {
  gid('thChips').innerHTML = ['Ngày', 'Tuần', 'Tháng', 'Năm'].map(l => `<button class="chip ${l === TH_LOAI ? 'on' : ''}" onclick="TH_LOAI='${l}';thChips();xemTH()">${l}</button>`).join('');
}
async function xemTH() { renderTH(await api('tongHop', TH_LOAI, val('thNgay'))); }
function renderTH(r) {
  const t = r.tong, ds = r.ds.slice().sort((a, b) => b.dt - a.dt), max = Math.max(1, ...ds.map(c => c.dt));
  const badge = c => {
    if (r.loai !== 'Ngày' || !c.hoatDong) return '';
    const k = c.quayDaNop; return `<span class="tag ${k >= c.soQuay ? 'ok' : k ? 'wn' : 'er'}">Tổng kết ${k}/${c.soQuay} quầy</span>`;
  };
  gid('thBody').innerHTML = `<p class="muted">${r.ds.length} chi nhánh • ${r.soNV} nhân viên • ${fmtDate(r.tu)} → ${fmtDate(r.den)}</p>
    <div class="stat"><div><span>Doanh thu</span><b>${money(t.dt)}</b></div><div><span>Lợi nhuận</span><b class="${t.ln < 0 ? 'neg' : ''}">${money(t.ln)}</b></div>
      <div><span>Giá vốn (${pct(t.gv, t.dt)}%)</span><b>${money(t.gv)}</b></div><div><span>Chi phí</span><b>${money(t.cp)}</b></div>
      <div><span>Đã nộp CTY</span><b>${money(t.nop)}</b></div><div><span>Nhập hàng</span><b>${money(t.nhap)}</b></div>
      <div><span>Thu khác (ve chai, giữ xe)</span><b>${money(t.thuKhac)}</b></div><div><span>Ứng lương</span><b>${money(t.ung)}</b></div></div>
    <div class="sec">Theo từng chi nhánh</div>
    ${ds.map((c, i) => `<div class="card" style="${c.hoatDong ? '' : 'opacity:.6'}"><div class="row"><span class="rank">${i + 1}</span><b class="grow" style="font-size:18px">${esc(c.ten)}</b><b style="color:var(--pri);font-size:19px">${money(c.dt)}</b></div>
      <div class="bar" style="margin:8px 0 2px"><i style="width:${Math.round(c.dt / max * 100)}%"></i></div>
      <div class="muted">${pct(c.dt, t.dt)}% tổng doanh thu • ${c.soNV} nhân viên ${badge(c)}${c.hoatDong ? '' : ' <span class="tag off">Ngừng</span>'}</div>
      <div class="sub2"><div><b class="${c.ln < 0 ? 'neg' : ''}">${money(c.ln)}</b>Lợi nhuận</div><div><b>${money(c.nop)}</b>Đã nộp</div><div><b>${money(c.cp)}</b>Chi phí</div></div></div>`).join('') || '<p class="muted center">Chưa có chi nhánh</p>'}
    <div class="card"><h3>Chi tiết theo ${r.loai === 'Năm' ? 'tháng' : 'ngày'} (tất cả chi nhánh)</h3>
      <table><tr><th>${r.loai === 'Năm' ? 'Tháng' : 'Ngày'}</th><th>Doanh thu</th><th>Chi phí</th><th>Lợi nhuận</th></tr>
      ${r.dong.map(d => `<tr><td>${d.ky.length > 7 ? fmtDate(d.ky).slice(0, 5) : d.ky}</td><td>${money(d.dt)}</td><td>${money(d.cp)}</td><td class="${d.ln < 0 ? 'neg' : ''}">${money(d.ln)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted center">Chưa có số liệu</td></tr>'}</table></div>
    <p class="muted">Doanh thu ưu tiên số kiểm hàng → số tổng kết tiền → số máy bán, giống màn Báo cáo từng chi nhánh.</p>`;
}

showLogin();

/* ===== Báo cáo Xuất Nhập Tồn ===== */
let XN = null, XN_PAGE = 0;
function scrXNT() {
  const d = todayStr();
  layout('&#x1F4CB; Xuất Nhập Tồn', `<div class="row"><div class="grow"><label>Từ ngày</label><input type="date" id="xnTu" value="${d.slice(0, 8)}01"></div>
    <div class="grow"><label>Đến ngày</label><input type="date" id="xnDen" value="${d}"></div></div>
    <div class="row"><div class="grow"><label>Loại hàng</label><select id="xnLoai"><option value="">Tất cả</option><option>Bán sẵn</option><option>Chế biến</option></select></div>
    <div class="grow"><label>Tìm món</label><input id="xnQ" placeholder="Tên hoặc mã"></div></div>
    <div class="row"><button class="btn primary grow" onclick="xemXNT()">Xem báo cáo</button><button class="btn" onclick="xuatXNT()">&#x2B07; Excel</button><button class="btn" onclick="window.print()">&#x1F5A8; In</button></div>
    <div id="xnBody"></div>`);
  ['xnLoai', 'xnQ'].forEach(i => gid(i).oninput = () => { XN_PAGE = 0; renderXNT(); });
  xemXNT();
}
async function xemXNT() { XN_PAGE = 0; XN = await api('xnt', val('xnTu'), val('xnDen')); renderXNT(); }
function xnRows() {
  const k = noDau(val('xnQ')), l = val('xnLoai');
  return XN.rows.filter(r => (!l || r.loai === l) && (!k || noDau(r.ten + ' ' + r.ma).includes(k)));
}
function renderXNT() {
  if (!XN) return;
  const rs = xnRows(), PS = 30, pages = Math.max(1, Math.ceil(rs.length / PS)); XN_PAGE = Math.min(XN_PAGE, pages - 1);
  const T = f => rs.reduce((a, r) => a + r[f], 0), q = n => Math.round(n * 100) / 100;
  const th = '<th>Đầu kỳ</th><th>Nhập</th><th>Xuất</th><th>Cuối kỳ</th>';
  gid('xnBody').innerHTML = `<div class="stat"><div><span>Tồn đầu</span><b>${money(T('gtDau'))}</b></div><div><span>Nhập</span><b>${money(T('gtNhap'))}</b></div>
    <div><span>Xuất</span><b>${money(T('gtXuat'))}</b></div><div><span>Tồn cuối</span><b>${money(T('gtCuoi'))}</b></div></div>
    <div style="overflow-x:auto"><table class="xnt"><tr><th rowspan="2">Món</th><th colspan="4">Số lượng</th><th colspan="4">Giá trị (theo giá vốn)</th></tr><tr>${th}${th}</tr>
    ${rs.slice(XN_PAGE * PS, XN_PAGE * PS + PS).map(r => `<tr><td><div class="row" style="flex-wrap:nowrap;gap:8px">${r.anh ? `<img src="${esc(r.anh)}" style="width:36px;height:36px;object-fit:cover;border-radius:6px">` : ''}<div><b>${esc(r.ten)}</b><div class="muted">${esc(r.ma)} • ${esc(r.dvt || '')}</div></div></div></td>
      <td>${q(r.dau)}</td><td>${q(r.nhap)}</td><td>${q(r.xuat)}</td><td><b class="${r.cuoi < 0 ? 'neg' : ''}">${q(r.cuoi)}</b></td>
      <td>${money(r.gtDau)}</td><td>${money(r.gtNhap)}</td><td>${money(r.gtXuat)}</td><td><b>${money(r.gtCuoi)}</b></td></tr>`).join('')}
    <tr><td><b>Tổng (${rs.length} món)</b></td><td>${q(T('dau'))}</td><td>${q(T('nhap'))}</td><td>${q(T('xuat'))}</td><td>${q(T('cuoi'))}</td>
      <td>${money(T('gtDau'))}</td><td>${money(T('gtNhap'))}</td><td>${money(T('gtXuat'))}</td><td>${money(T('gtCuoi'))}</td></tr></table></div>
    <div class="row" style="justify-content:center;margin:8px 0"><button class="btn sm" ${XN_PAGE ? '' : 'disabled'} onclick="XN_PAGE--;renderXNT()">&#x2039;</button><span class="muted">Trang ${XN_PAGE + 1}/${pages}</span><button class="btn sm" ${XN_PAGE < pages - 1 ? '' : 'disabled'} onclick="XN_PAGE++;renderXNT()">&#x203A;</button></div>
    <p class="muted">Xuất = bán + nhân viên ăn/lưu mẫu + hủy. Hàng chế biến tính theo phần nên không có số nhập. Tồn tính ngược từ tồn hiện tại.</p>`;
}
function xuatXNT() {
  if (!XN) return;
  const c = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const L = [['Mã', 'Tên', 'Loại', 'ĐVT', 'Giá vốn', 'Tồn đầu', 'Nhập', 'Xuất', 'Tồn cuối', 'GT đầu', 'GT nhập', 'GT xuất', 'GT cuối']];
  xnRows().forEach(r => L.push([r.ma, r.ten, r.loai, r.dvt, r.giaVon, r.dau, r.nhap, r.xuat, r.cuoi, r.gtDau, r.gtNhap, r.gtXuat, r.gtCuoi]));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + L.map(r => r.map(c).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = `XuatNhapTon_${XN.tu}_${XN.den}.csv`; a.click();
}
</script>
</body>
